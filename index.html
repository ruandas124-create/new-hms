
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMS Hospital Management</title>
    <meta name="description" content="A role-based hospital patient management system featuring real-time data synchronization between Front Office, Doctors, and Package Teams with integrated AI-assisted counseling strategies." />
    <meta property="og:title" content="HMS Hospital Management" />
    <meta property="og:description" content="A role-based hospital patient management system featuring real-time data synchronization between Front Office, Doctors, and Package Teams with integrated AI-assisted counseling strategies." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              hospital: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                900: '#0c4a6e',
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      * {
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      img {
        max-width: 100%;
        height: auto;
      }
      .container, .main-content {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }
      .table-container {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .break-anywhere {
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .no-print {
        @media print {
          display: none;
        }
      }
    </style>

</head>
